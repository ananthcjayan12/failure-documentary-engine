name: Apply FDE v0.6 implementation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/narration-live-jobs-sfx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/narration-live-jobs-sfx
          fetch-depth: 0

      - name: Verify and extract implementation
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/fde-bootstrap/chunk-00-0 \
            .github/fde-bootstrap/chunk-00-1 \
            .github/fde-bootstrap/chunk-00-2 \
            .github/fde-bootstrap/chunk-00-3 \
            .github/fde-bootstrap/chunk-01 \
            .github/fde-bootstrap/chunk-02 \
            .github/fde-bootstrap/chunk-03-0 \
            .github/fde-bootstrap/chunk-03-1 \
            .github/fde-bootstrap/chunk-03-2 \
            .github/fde-bootstrap/chunk-03-3 \
            .github/fde-bootstrap/chunk-04 \
            .github/fde-bootstrap/chunk-05 \
            .github/fde-bootstrap/chunk-06 \
            > /tmp/fde-v06.b64
          base64 --decode /tmp/fde-v06.b64 > /tmp/fde-v06-changes.tar.gz
          echo 'bfb751fd2ef3300ac7f73ae048fbcdae165fdabd3d8af70b14530d02b643a5da  /tmp/fde-v06-changes.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/fde-v06-changes.tar.gz -C .

      - name: Run validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q fde
          node --check fde/studio/static/app.js
          PYTHONPATH=. pytest -q

      - name: Publish actual source files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/fde-bootstrap
          rm -f .github/workflows/apply-fde-v06.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to publish.'
            exit 0
          fi
          git commit -m 'feat: add narration-first production, live jobs, and sound design'
          git push origin HEAD:feature/narration-live-jobs-sfx
