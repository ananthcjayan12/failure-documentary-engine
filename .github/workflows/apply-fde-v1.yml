name: Apply FDE V1 audio-first implementation

on:
  push:
    branches:
      - feature/v1-audio-first-documentary-flow
    paths:
      - .github/fde-v1-bootstrap/**
      - .github/workflows/apply-fde-v1.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/fde-v1-bootstrap/payload.b64 > /tmp/fde-v1.tar.gz
          echo "9dceb740c066c316eae8eaca59c493701305b478d64e732e6e828520714e616b  /tmp/fde-v1.tar.gz" | sha256sum --check -
          tar -xzf /tmp/fde-v1.tar.gz -C .
          rm -rf .github/fde-v1-bootstrap
          rm -f .github/workflows/apply-fde-v1.yml

      - name: Publish actual source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement V1 audio-first documentary flow"
          git push origin HEAD:feature/v1-audio-first-documentary-flow

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q fde tests
          pytest -q

# Triggered after the workflow existed on the branch so GitHub Actions can apply the staged source.
